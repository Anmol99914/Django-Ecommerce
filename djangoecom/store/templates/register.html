{% extends 'base.html' %}
{% block content %}

 <!-- Header-->
        <header class="bg-dark py-2">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">Register User</h1>
                </div>
            </div>
        </header><br/><br/>

    <div class = "container">
    <form method = "POST" action = "{% url 'register' %}">
      {% csrf_token %}
            {{ form.as_p }}
            {{ form.non_field_errors }}

            {% for field in form %}
                {% if field.errors %}
                    <div class="alert alert-danger">
                        {{ field.errors }}
                    </div>
                {% endif %}
            {% endfor%}
            <br/><br/>
    <button type="submit" class="btn btn-primary">Register</button>
</form>
    </div>
<br/>
<br/>
<br/>
<br/>

<br/>
<br/>
<br/>
<br/>
<br/>
<br/>
<br/>
{% endblock %}
